server {
    listen 127.0.0.1:7310;
    server_name localhost;
    server_tokens off;
    client_max_body_size 16k;
    location / {
        proxy_pass http://127.0.0.1:7320;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 90s;
    }
}
