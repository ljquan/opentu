limit_req_zone $binary_remote_addr zone=opentu_api:10m rate=5r/s;

server {
    listen 80;
    server_name 47.107.92.13;
    server_tokens off;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name 47.107.92.13;
    server_tokens off;
    client_max_body_size 4m;
    ssl_certificate /etc/letsencrypt/live/47.107.92.13/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/47.107.92.13/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:OPENTU_SSL:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    location /api/internal/ { return 404; }
    location /api/ {
        limit_req zone=opentu_api burst=15 nodelay;
        proxy_pass http://127.0.0.1:3201;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 90s;
    }
    location / {
        proxy_pass http://127.0.0.1:7320;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 90s;
    }
    location ~ /\. { deny all; }
}
