server {
    listen 127.0.0.1:7320;
    server_name localhost;
    root /usr/share/nginx/html;
    server_tokens off;
    client_max_body_size 4m;
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Content-Security-Policy "default-src 'self' https: data: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com https://www.google-analytics.com https://umami.tu-zi.com https://wiki.tu-zi.com; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https: wss: data: blob:; frame-src 'self' https://api.tu-zi.com data:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    location /api/internal/ { return 404; }
    location /api/ {
        proxy_pass http://127.0.0.1:3201;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host "";
        proxy_read_timeout 90s;
    }

    # Compatibility for clients that cached the previous relative-base shell.
    # A direct visit to /admin/providers resolved its assets below /admin/.
    location ^~ /admin/assets/ { rewrite ^/admin/assets/(.*)$ /assets/$1 last; }
    location ^~ /admin/icons/ { rewrite ^/admin/icons/(.*)$ /icons/$1 last; }
    location ^~ /admin/brand/ { rewrite ^/admin/brand/(.*)$ /brand/$1 last; }
    location = /admin/manifest.json { rewrite ^ /manifest.json last; }

    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|webp|avif|svg|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    location / { try_files $uri /index.html; }
    location ~ /\. { deny all; }
}
