# pr.opentu.ai - 预发布环境
# root 指向 releases/current 符号链接（由 deploy 命令管理）

server {
    server_name pr.opentu.ai;
    listen 443 ssl;
    http2 on;

    ssl_certificate /etc/letsencrypt/live/opentu.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/opentu.ai/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # 预发布版本 - 通过 current 符号链接指向最新部署版本
    root /home/opentu/releases/current;
    index index.html;

    # sw.js 不缓存
    location = /sw.js {
        try_files /sw.js =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # Tuzi 账户接口同源代理：转发系统令牌和用户 ID 请求头。
    location ^~ /__opentu_tuzi_session__/ {
        proxy_pass https://api.tu-zi.com/;
        proxy_set_header Host api.tu-zi.com;
        proxy_ssl_server_name on;
        proxy_ssl_name api.tu-zi.com;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # 静态资源长缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|map)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    server_name pr.opentu.ai;
    listen 80;
    return 301 https://$host$request_uri;
}
