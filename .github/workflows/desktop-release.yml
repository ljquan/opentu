name: Desktop Build & Release
run-name: "Desktop Release: ${{ github.ref_name }}"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "Opentu Desktop ${{ github.ref_name }}" \
            --notes "## 安装方式

          ### macOS / Linux 一键安装

          \`\`\`bash
          curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/scripts/install_opentu.sh | bash
          \`\`\`

          或指定版本：

          \`\`\`bash
          OPENTU_TAG=${{ github.ref_name }} curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/scripts/install_opentu.sh | bash
          \`\`\`

          ### Windows

          下载下方 Assets 中的 \`.msi\` 安装包，双击安装即可。

          ### macOS 未签名包打开方式

          如果第一次打开时被系统拦截：
          1. 对应用点右键，选择\"打开\"，在弹窗里确认\"打开\"
          2. 或在终端执行：\`xattr -dr com.apple.quarantine \"/Applications/Opentu.app\"\`

          ---

          ## 功能特性

          - **AI 图片生成**：多模型支持（GPT Image、Gemini）、多种比例
          - **AI 视频生成**：Veo、Seedance 等模型
          - **AI 音频生成**：Suno 音乐生成
          - **画布工作区**：流程图、思维导图、白板绘图
          - **素材库管理**：本地媒体文件管理、批量操作
          - **知识库**：笔记、标签、搜索
          - **数据备份**：自动备份、导入导出

          ## 数据存储

          所有数据存储在本地，不会上传到云端。**首次启动时可自定义存储路径**。

          ### 默认存储位置
          - Windows: `%APPDATA%/com.opentu.desktop/media/`
          - macOS: `~/Library/Application Support/com.opentu.desktop/media/`
          - Linux: `~/.local/share/com.opentu.desktop/media/`

          ### 自定义存储路径
          首次启动应用时，会弹出路径选择对话框，您可以选择任意文件夹作为生成产物的存放位置。

          ### 文件分类存储
          生成的文件会自动按类型分类存放：
          - `{存储路径}/图片/` — 存放 AI 生成的图片文件
          - `{存储路径}/视频/` — 存放 AI 生成的视频文件
          - `{存储路径}/音频/` — 存放 AI 生成的音频文件

          ### 修改存储路径
          启动后在 **设置 → 存储路径** 中可随时修改。

          ### 获取生成资源
          1. 打开应用，进入设置查看当前存储路径
          2. 在文件资源管理器中打开该路径
          3. 进入对应的「图片」、「视频」或「音频」文件夹即可找到生成的文件
          4. 也可在应用的素材库面板中直接预览和管理生成的资源
          " \
            --draft

  build-macos-arm:
    needs: create-release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: pnpm/action-setup@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "apps/desktop/src-tauri -> target"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Desktop
        working-directory: apps/desktop
        env:
          APPLE_SIGNING_IDENTITY: "-"
          CI: true
          RUST_BACKTRACE: "1"
        run: |
          echo "Starting build..."
          pnpm tauri build --target aarch64-apple-darwin --verbose
      - name: Upload assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          BUNDLE="apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle"
          echo "Checking bundle directory: $BUNDLE"
          ls -la $BUNDLE
          if [ -d "$BUNDLE/dmg" ]; then
            find "$BUNDLE/dmg" -name "*.dmg" -exec sh -c 'cp "$1" "Opentu-macos-aarch64.dmg" && gh release upload "$TAG" "Opentu-macos-aarch64.dmg" --clobber' _ {} \;
          fi
          if [ -d "$BUNDLE/macos" ]; then
            find "$BUNDLE/macos" -name "*.tar.gz" -exec sh -c 'cp "$1" "Opentu-macos-aarch64.tar.gz" && gh release upload "$TAG" "Opentu-macos-aarch64.tar.gz" --clobber' _ {} \;
          fi

  build-windows:
    needs: create-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: pnpm/action-setup@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "apps/desktop/src-tauri -> target"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Desktop
        working-directory: apps/desktop
        env:
          CI: true
        run: |
          echo "Starting build..."
          pnpm tauri build --verbose
      - name: Upload assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        shell: pwsh
        run: |
          $bundle = "apps/desktop/src-tauri/target/release/bundle"
          Write-Host "Checking bundle directory: $bundle"
          Get-ChildItem -Path $bundle -Recurse
          if (Test-Path "$bundle/msi") {
            Get-ChildItem "$bundle/msi/*.msi" | ForEach-Object {
              Copy-Item $_.FullName "Opentu-windows-x86_64.msi"
              gh release upload $env:TAG "Opentu-windows-x86_64.msi" --clobber
            }
          }
          if (Test-Path "$bundle/nsis") {
            Get-ChildItem "$bundle/nsis/*-setup.exe" | ForEach-Object {
              Copy-Item $_.FullName "Opentu-windows-x86_64-setup.exe"
              gh release upload $env:TAG "Opentu-windows-x86_64-setup.exe" --clobber
            }
          }

  build-linux:
    needs: create-release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: pnpm/action-setup@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "apps/desktop/src-tauri -> target"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Desktop
        working-directory: apps/desktop
        env:
          CI: true
          RUST_BACKTRACE: "1"
        run: |
          echo "Starting build..."
          pnpm tauri build --verbose
      - name: Upload assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          BUNDLE="apps/desktop/src-tauri/target/release/bundle"
          echo "Checking bundle directory: $BUNDLE"
          ls -la $BUNDLE
          if [ -d "$BUNDLE/appimage" ]; then
            find "$BUNDLE/appimage" -name "*.AppImage" -exec sh -c 'cp "$1" "Opentu-linux-x86_64.AppImage" && gh release upload "$TAG" "Opentu-linux-x86_64.AppImage" --clobber' _ {} \;
          fi
          if [ -d "$BUNDLE/deb" ]; then
            find "$BUNDLE/deb" -name "*.deb" -exec sh -c 'cp "$1" "Opentu-linux-x86_64.deb" && gh release upload "$TAG" "Opentu-linux-x86_64.deb" --clobber' _ {} \;
          fi
          if [ -d "$BUNDLE/rpm" ]; then
            find "$BUNDLE/rpm" -name "*.rpm" -exec sh -c 'cp "$1" "Opentu-linux-x86_64.rpm" && gh release upload "$TAG" "Opentu-linux-x86_64.rpm" --clobber' _ {} \;
          fi

  upload-install-script:
    needs: [build-macos-arm, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload install script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            scripts/install_opentu.sh \
            --clobber