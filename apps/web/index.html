    <style>
      :root {
        --app-boot-text: #f8f5ff;
        --app-boot-muted: rgba(235, 226, 255, 0.68);
        --app-boot-accent: #b68cff;
        --app-boot-accent-strong: #7955ff;
      }

      #app-boot-loading {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        padding: 24px;
        overflow: hidden;
        isolation: isolate;
        background: #090714 url('/brand/foxvue-night-sky.webp') center / cover no-repeat;
        transition: opacity 0.24s ease, visibility 0.24s ease;
        opacity: 1;
        visibility: visible;
        pointer-events: none;
      }

      #app-boot-loading.is-leaving {
        opacity: 0;
        visibility: hidden;
      }

      #app-boot-loading::before,
      #app-boot-loading::after {
        position: absolute;
        inset: -14%;
        z-index: 0;
        content: '';
        pointer-events: none;
      }

      #app-boot-loading::before {
        background:
          radial-gradient(circle at 24% 42%, rgba(145, 97, 255, 0.24), transparent 23%),
          radial-gradient(circle at 76% 18%, rgba(88, 105, 255, 0.2), transparent 20%),
          linear-gradient(120deg, rgba(8, 5, 22, 0.48), rgba(9, 7, 20, 0.12) 52%, rgba(7, 4, 19, 0.62));
        animation: app-boot-breathe 8s ease-in-out infinite alternate;
      }

      #app-boot-loading::after {
        background-image:
          radial-gradient(circle, rgba(255, 255, 255, 0.58) 0 1px, transparent 1.5px),
          radial-gradient(circle, rgba(190, 150, 255, 0.36) 0 1px, transparent 1.5px);
        background-position: 12% 20%, 68% 72%;
        background-size: 180px 180px, 240px 240px;
        opacity: 0.3;
        animation: app-boot-drift 18s linear infinite;
      }

      @keyframes app-boot-breathe {
        from { transform: scale(1); opacity: 0.82; }
        to { transform: scale(1.08); opacity: 1; }
      }

      @keyframes app-boot-drift {
        from { transform: translate3d(0, 0, 0); }
        to { transform: translate3d(-28px, 18px, 0); }
      }

      .app-boot-status {
        position: relative;
        z-index: 1;
        display: grid;
        grid-template-columns: 48px minmax(0, 1fr);
        align-items: center;
        gap: 12px;
        width: min(420px, calc(100vw - 40px));
        min-width: 0;
        max-width: 420px;
        padding: 18px 20px 17px 16px;
        overflow: hidden;
        color: var(--app-boot-muted);
        border: 1px solid rgba(224, 199, 255, 0.2);
        border-radius: 8px;
        background: linear-gradient(135deg, rgba(28, 20, 58, 0.82), rgba(13, 10, 31, 0.72));
        font-size: 12px;
        line-height: 1.4;
        box-shadow: 0 26px 70px rgba(4, 2, 16, 0.56), 0 0 0 1px rgba(167, 116, 255, 0.08),
          0 0 52px rgba(117, 68, 255, 0.16);
        backdrop-filter: blur(22px) saturate(1.3);
        -webkit-backdrop-filter: blur(18px) saturate(1.25);
      }

      .app-boot-mark {
        display: block;
        width: 48px;
        height: 48px;
        border-radius: 14px;
        box-shadow: 0 0 0 1px rgba(231, 211, 255, 0.2), 0 8px 24px rgba(87, 43, 194, 0.36);
        animation: app-boot-mark-pulse 2.8s ease-in-out infinite;
      }

      @keyframes app-boot-mark-pulse {
        0%, 100% { transform: scale(1); filter: brightness(1); }
        50% { transform: scale(1.06); filter: brightness(1.14); }
      }

      .app-boot-copy {
        min-width: 0;
      }

      .app-boot-title {
        margin: 0;
        color: var(--app-boot-text);
        font-size: 14px;
        font-weight: 650;
        letter-spacing: 0;
      }

      .app-boot-tip {
        display: block;
        margin: 3px 0 0;
        overflow: hidden;
        color: var(--app-boot-muted);
        font-size: 11px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .app-boot-note {
        display: none;
      }

      .app-boot-progress {
        position: absolute;
        top: 0;
        right: 0;
        left: 0;
        height: 2px;
      }

      .app-boot-progress-track {
        display: block;
        width: 100%;
        height: 100%;
        background: rgba(221, 198, 255, 0.12);
      }

      .app-boot-progress-fill {
        display: block;
        width: 0%;
        height: 100%;
        border-radius: 0 999px 999px 0;
        background: linear-gradient(90deg, var(--app-boot-accent-strong), var(--app-boot-accent));
        box-shadow: 0 0 14px rgba(174, 129, 255, 0.64);
        transition: width 0.24s ease;
      }

      .app-boot-progress-value {
        display: none;
      }

      html.app-boot-error .app-boot-progress {
        background: rgba(233, 30, 99, 0.1);
        color: #e91e63;
      }

      html.app-boot-error .app-boot-progress-track {
        background: rgba(233, 30, 99, 0.16);
      }

      html.app-boot-error .app-boot-progress-fill {
        background: #d64d62;
        box-shadow: 0 0 16px rgba(233, 30, 99, 0.22);
      }

      html.app-boot-error .app-boot-status {
        border-color: rgba(214, 77, 98, 0.16);
      }

      @media (max-width: 480px) {
        #app-boot-loading {
          place-items: center;
          padding: 20px;
        }

        .app-boot-status {
          width: min(100%, 360px);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #app-boot-loading::before,
        #app-boot-loading::after,
        .app-boot-mark {
          animation: none;
        }
      }

    <div
      id="app-boot-loading"
      role="status"
      aria-live="polite"
      aria-label="应用正在加载"
    >
      <div class="app-boot-status">
        <img
          class="app-boot-mark"
          src="/icons/foxvue-mark-192.png"
          alt=""
          width="38"
          height="38"
        />
        <div class="app-boot-copy">
          <p class="app-boot-title" data-app-boot-title>正在打开狐图 FoxVue</p>
          <p class="app-boot-tip" data-app-boot-tip>正在准备你的创作空间...</p>
        </div>
        <div
          class="app-boot-progress"
          role="progressbar"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="0"
          data-app-boot-progress
        >
          <span class="app-boot-progress-track" aria-hidden="true">
            <span
              class="app-boot-progress-fill"
              data-app-boot-progress-fill
            ></span>
          </span>
          <span class="app-boot-progress-value" data-app-boot-progress-value>
            0%
          </span>
        </div>
        <div class="app-boot-note" data-app-boot-note></div>
      </div>
    </div>
    <script>
      (function () {
        var bootReady = false;
        var bootProgress = 0;
        var simulationStartAt = Date.now();
        var simulationTimer = 0;
        var slowTipTimer = window.setTimeout(function () {
          var tip = document.querySelector('[data-app-boot-tip]');
          if (tip) {
            tip.textContent =
              '首次打开或网络较慢时会多等一会，正在努力准备中...';
          }
        }, 2200);
        var removeTimer = 0;
        var resolveMainEntryReady = null;
        var BOOT_IMPORT_RETRY_STORAGE_KEY = '__OPENTU_BOOT_IMPORT_RETRY_AT__';
        var BOOT_IMPORT_RETRY_TTL_MS = 2 * 60 * 1000;
        window.__OPENTU_START_MAIN_ENTRY__ = new Promise(function (resolve) {
          resolveMainEntryReady = resolve;
        });

        function clearBootImportRetryFlag() {
          try {
            window.sessionStorage.removeItem(BOOT_IMPORT_RETRY_STORAGE_KEY);
          } catch (_error) {
            // ignore sessionStorage cleanup failures
          }
        }

        function isRecoverableBootImportError(error) {
          var message =
            error && typeof error.message === 'string'
              ? error.message
              : String(error || '');

          return (
            /Failed to fetch dynamically imported module/i.test(message) ||
            /Importing a module script failed/i.test(message) ||
            /Loading chunk [\w-]+ failed/i.test(message) ||
            /ChunkLoadError/i.test(message)
          );
        }

        function hasBootImportRetryParam() {
          try {
            return new URLSearchParams(window.location.search).has(
              '_lazy_chunk_retry'
            );
          } catch (_error) {
            return window.location.search.indexOf('_lazy_chunk_retry=') !== -1;
          }
        }

        function createBootImportRecoveryUrl() {
          var recoveryUrl = new URL(window.location.href);
          recoveryUrl.searchParams.set('_lazy_chunk_retry', '1');
          recoveryUrl.searchParams.set('_t', String(Date.now()));
          return recoveryUrl.toString();
        }

        function prepareBootImportRecovery() {
          var tasks = [];

          try {
            if (navigator.serviceWorker && navigator.serviceWorker.controller) {
              navigator.serviceWorker.controller.postMessage({
                type: 'RECOVER_DYNAMIC_IMPORT_FAILURE',
                appVersion: getBootAppVersion(),
                moduleKey: 'boot-main-entry',
              });
            }
          } catch (_error) {
            // ignore best-effort SW notification failures
          }

          try {
            if (window.caches && typeof window.caches.keys === 'function') {
              tasks.push(
                window.caches.keys().then(function (cacheNames) {
                  return Promise.all(
                    cacheNames
                      .filter(function (name) {
                        return name.indexOf('drawnix-static-v') === 0;
                      })
                      .map(function (name) {
                        return window.caches.delete(name);
                      })
                  );
                })
              );
            }
          } catch (_error) {
            // ignore cache cleanup failures
          }

          return Promise.allSettled(tasks);
        }

        window.__OPENTU_BOOT_DYNAMIC_IMPORT_RECOVERY__ = function (error) {
          if (
            !isRecoverableBootImportError(error) ||
            isBootLocalDevelopment()
          ) {
            return false;
          }

          try {
            var lastRetryAt = Number(
              window.sessionStorage.getItem(BOOT_IMPORT_RETRY_STORAGE_KEY)
            );
            if (
              isFinite(lastRetryAt) &&
              Date.now() - lastRetryAt <= BOOT_IMPORT_RETRY_TTL_MS
            ) {
              return false;
            }
            window.sessionStorage.setItem(
              BOOT_IMPORT_RETRY_STORAGE_KEY,
              String(Date.now())
            );
          } catch (_error) {
            if (hasBootImportRetryParam()) {
              return false;
            }
          }

          var recoveryUrl = createBootImportRecoveryUrl();
          var didReload = false;
          var reload = function () {
            if (didReload) {
              return;
            }
            didReload = true;
            window.location.replace(recoveryUrl);
          };

          var tip = document.querySelector('[data-app-boot-tip]');
          if (tip) {
            tip.textContent = '启动资源已更新，正在自动刷新恢复...';
          }

          window.setTimeout(reload, 700);
          prepareBootImportRecovery().then(reload, reload);
          return true;
        };

        function clearBootTimers() {
          if (slowTipTimer) {
            window.clearTimeout(slowTipTimer);
            slowTipTimer = 0;
          }
          if (removeTimer) {
            window.clearTimeout(removeTimer);
            removeTimer = 0;
          }
          if (simulationTimer) {
            window.clearInterval(simulationTimer);
            simulationTimer = 0;
          }
        }

        function getBootRoot() {
          return document.getElementById('app-boot-loading');
        }

        function getBootAppVersion() {
          var versionMeta = document.querySelector('meta[name="app-version"]');
          return versionMeta
            ? versionMeta.getAttribute('content') || '0.0.0'
            : '0.0.0';
        }

        function isBootLocalDevelopment() {
          return (
            window.location.hostname === 'localhost' ||
            window.location.hostname === '127.0.0.1' ||
            window.location.hostname.endsWith('.localhost')
          );
        }

        function clampProgress(value) {
          if (!isFinite(value)) {
            return bootProgress;
          }
          return Math.max(0, Math.min(100, value));
        }

        function renderProgress() {
          var progressRoot = document.querySelector('[data-app-boot-progress]');
          var progressFill = document.querySelector(
            '[data-app-boot-progress-fill]'
          );
          var progressValue = document.querySelector(
            '[data-app-boot-progress-value]'
          );
          var safeProgress = Math.round(clampProgress(bootProgress));

          if (progressRoot) {
            progressRoot.setAttribute('aria-valuenow', String(safeProgress));
          }
          if (progressFill) {
            progressFill.style.width = safeProgress + '%';
          }
          if (progressValue) {
            progressValue.textContent = safeProgress + '%';
          }
        }

        function startSimulatedProgress() {
          if (simulationTimer) {
            return;
          }

          simulationTimer = window.setInterval(function () {
            if (bootReady) {
              window.clearInterval(simulationTimer);
              simulationTimer = 0;
              return;
            }

            var elapsed = Date.now() - simulationStartAt;
            var simulatedProgress = Math.min(82, (elapsed / 4200) * 82);
            if (simulatedProgress > bootProgress) {
              bootProgress = simulatedProgress;
              renderProgress();
            }

            if (simulatedProgress >= 82) {
              window.clearInterval(simulationTimer);
              simulationTimer = 0;
            }
          }, 60);
        }

        function setProgress(value, options) {
          if (bootReady) {
            return;
          }

          if (typeof value === 'number' && isFinite(value)) {
            bootProgress = Math.max(bootProgress, clampProgress(value));
          }

          var title = document.querySelector('[data-app-boot-title]');
          var tip = document.querySelector('[data-app-boot-tip]');
          var note = document.querySelector('[data-app-boot-note]');

          if (options && typeof options.title === 'string' && title) {
            title.textContent = options.title;
          }
          if (options && typeof options.tip === 'string' && tip) {
            tip.textContent = options.tip;
          }
          if (options && typeof options.note === 'string' && note) {
            note.textContent = options.note;
          }

          renderProgress();
        }

        function markReady() {
          if (bootReady) {
            return;
          }
          document.documentElement.classList.add('app-ready');
          clearBootImportRetryFlag();
          setProgress(100, {
            tip: '启动完成，正在打开狐图 FoxVue...',
          });
          bootReady = true;
          clearBootTimers();
          var bootRoot = getBootRoot();
          if (!bootRoot) {
            return;
          }
          bootRoot.classList.add('is-leaving');
          var removeBootRoot = function () {
            if (bootRoot.parentNode) {
              bootRoot.parentNode.removeChild(bootRoot);
            }
          };
          bootRoot.addEventListener('transitionend', removeBootRoot, {
            once: true,
          });
          removeTimer = window.setTimeout(removeBootRoot, 360);
        }

        function markError(message) {
          if (bootReady) {
            return;
          }
          setProgress(100);
          clearBootTimers();
          document.documentElement.classList.add('app-boot-error');
          var title = document.querySelector('[data-app-boot-title]');
          var tip = document.querySelector('[data-app-boot-tip]');
          if (title) {
            title.textContent = '启动中遇到问题';
          }
          if (tip) {
            tip.textContent = message || '资源加载失败，请刷新页面后重试。';
          }
        }

        window.__OPENTU_BOOT__ = {
          markReady: markReady,
          markError: markError,
          setProgress: setProgress,
        };

        // Ordinary routes render their own shell without waiting for optional
        // cache and workspace work. Keep the overlay as a short safety net for
        // failed dynamic imports, while direct canvas routes retain full boot.
        if (!/[?&]board=/.test(window.location.search)) {
          window.setTimeout(function () {
            if (!bootReady && document.getElementById('root') && document.getElementById('root').children.length) {
              markReady();
            }
          }, 1200);
        }

        function shouldEnableEarlyServiceWorkerBootstrap() {
          if (isBootLocalDevelopment()) {
            return false;
          }
          try {
            var swParam = new URLSearchParams(window.location.search).get('sw');
            if (swParam === '0') {
              return false;
            }
            return true;
          } catch {
            if (window.location.search.indexOf('sw=0') !== -1) {
              return false;
            }
            return true;
          }
        }

        function cleanupExplicitlyDisabledServiceWorker() {
          if (!('serviceWorker' in navigator)) {
            return;
          }

          navigator.serviceWorker
            .getRegistration()
            .then(function (registration) {
              if (registration) {
                return registration.unregister();
              }
              return false;
            })
            .catch(function (error) {
              console.warn(
                '[Boot] Disabled service worker cleanup failed:',
                error
              );
            });
        }

        function setupEarlyServiceWorkerBootstrap() {
          if (!('serviceWorker' in navigator)) {
            return;
          }

          if (!shouldEnableEarlyServiceWorkerBootstrap()) {
            cleanupExplicitlyDisabledServiceWorker();
            setProgress(52, {
              tip: '已按 URL 参数跳过离线缓存服务，正在直接启动狐图 FoxVue...',
              source: 'phase',
            });
            return;
          }

          if (!window.__OPENTU_SW_REGISTRATION_PROMISE__) {
            setProgress(undefined, {
              tip: '正在连接启动缓存服务...',
              source: 'phase',
            });

            window.__OPENTU_SW_REGISTRATION_PROMISE__ = navigator.serviceWorker
              .register('/sw.js')
              .then(function (registration) {
                setProgress(54, {
                  tip: '启动缓存服务已连接，正在准备资源清单...',
                  source: 'phase',
                });

                if (
                  registration.active &&
                  !registration.installing &&
                  !registration.waiting
                ) {
                  setProgress(58, {
                    tip: '启动缓存服务已就绪，正在准备狐图 FoxVue...',
                    source: 'phase',
                  });
                }

                return registration;
              })
              .catch(function (error) {
                console.warn(
                  '[Boot] Early service worker registration failed:',
                  error
                );
                setProgress(52, {
              tip: '离线加速未启用，正在直接启动狐图 FoxVue...',
                  source: 'phase',
                });
                return null;
              });
          }
        }

        renderProgress();
        startSimulatedProgress();
        // Service Worker registration is scheduled by the application after the first frame.
        if (resolveMainEntryReady) {
          resolveMainEntryReady();
          resolveMainEntryReady = null;
        }

        window.addEventListener(
          'error',
          function (event) {
            var target = event && event.target;
            if (target && target !== window && (target.src || target.href)) {
              var resourceUrl = target.src || target.href || '';
              var resourceName = resourceUrl.split('/').pop() || '资源文件';
              markError(resourceName + ' 加载失败，请刷新页面后重试。');
              return;
            }

            var message =
              event && typeof event.message === 'string' && event.message.trim()
                ? event.message.trim()
                : '启动脚本执行失败，请刷新页面后重试。';
            markError(message);
          },
          { once: true }
        );

        window.addEventListener(
          'unhandledrejection',
          function (event) {
            var reason = event && event.reason;
            var message =
              reason && typeof reason.message === 'string'
                ? reason.message
                : typeof reason === 'string'
                ? reason
                : '启动过程中发生异常，请刷新页面后重试。';
            markError(message);
          },
          { once: true }
        );
      })();
    </script>
    <div id="root"></div>
    <script type="module">
      (async function () {
        try {
          await (window.__OPENTU_START_MAIN_ENTRY__ || Promise.resolve());
          await import('./src/main.tsx');
        } catch (error) {
          if (
            window.__OPENTU_BOOT_DYNAMIC_IMPORT_RECOVERY__ &&
            window.__OPENTU_BOOT_DYNAMIC_IMPORT_RECOVERY__(error)
          ) {
            return;
          }
          throw error;
        }
      })();
    </script>
